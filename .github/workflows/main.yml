---
name: Test Suite

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:   # manual trigger button on GitHub Actions page

permissions:
  contents: read

jobs:
  tests:
    name: "Python ${{ matrix.python-version }}"
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.8", "3.9", "3.10", "3.11", "3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: ${{ matrix.python-version }}

      # The httpx2/httpcore2 backports live in a `uv` workspace, which cannot be
      # installed directly from git; check it out next to the test run.
      - name: Check out the httpx2/httpcore2 backport
        if: ${{ matrix.python-version == '3.8' || matrix.python-version == '3.9' }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: py38deps/httpx2
          ref: main
          path: .py38deps/httpx2
          persist-credentials: false

      - name: Install dependencies (Python 3.8 & 3.9)
        if: ${{ matrix.python-version == '3.8' || matrix.python-version == '3.9' }}
        run: scripts/install-py38 python

      - name: Install dependencies
        if: ${{ matrix.python-version != '3.8' && matrix.python-version != '3.9' }}
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[full]"
          # `anyio` is pinned to the version in `uv.lock` because the `mypy==2.1.0`
          # pin relies on its typing; newer anyio releases change the stubs.
          python -m pip install \
            "anyio==4.14.2" \
            "coverage[toml]>=7.8.2" \
            "httpx2[zstd]>=2.0.0" \
            "importlib-metadata==9.0.0" \
            "mypy==2.1.0" \
            "pytest==9.1.1" \
            "pytest-codspeed>=4.1.1" \
            "ruff==0.16.0" \
            "trio==0.33.0" \
            "twine==7.0.0" \
            "types-PyYAML==6.0.12.20250516"

      - name: Run linting checks
        if: ${{ matrix.python-version != '3.8' && matrix.python-version != '3.9' }}
        run: |
          ./scripts/sync-version
          ruff format --check --diff starlette tests benchmarks
          mypy starlette tests benchmarks
          ruff check starlette tests benchmarks

      - name: "Build package"
        if: ${{ matrix.python-version == '3.14' }}
        run: |
          python -m pip install build
          python -m build
          twine check dist/*

      # `--branch` is skipped on Python 3.8/3.9, where coverage.py reports bogus
      # partial branches across `async for` / `async with` arcs. Upstream carried
      # the same workaround for Python 3.9.
      # See https://github.com/Kludex/starlette/issues/2452.
      - name: "Run tests (Python 3.8 & 3.9)"
        if: ${{ matrix.python-version == '3.8' || matrix.python-version == '3.9' }}
        run: python -m coverage run -m pytest tests

      - name: "Run tests"
        if: ${{ matrix.python-version != '3.8' && matrix.python-version != '3.9' }}
        run: python -m coverage run --branch -m pytest tests

      - name: "Enforce coverage (Python 3.8 & 3.9)"
        if: ${{ matrix.python-version == '3.8' || matrix.python-version == '3.9' }}
        run: python -m coverage report --show-missing --skip-covered --fail-under=100

      - name: "Enforce coverage"
        if: ${{ matrix.python-version != '3.8' && matrix.python-version != '3.9' }}
        run: python -m coverage report --show-missing --skip-covered --fail-under=100

      - name: Upload dist
        if: ${{ matrix.python-version == '3.14' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist/

  # https://github.com/marketplace/actions/alls-green#why
  check:
    if: always()
    needs: [tests]
    runs-on: ubuntu-latest
    steps:
      - name: Decide whether the needed jobs succeeded or failed
        uses: re-actors/alls-green@05ac9388f0aebcb5727afa17fcccfecd6f8ec5fe # v1.2.2
        with:
          jobs: ${{ toJSON(needs) }}
